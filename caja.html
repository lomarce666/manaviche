<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja">
<title>Caja</title>
<link rel="icon" type="image/png" href="/iconos/cocina-192.png">
<link rel="apple-touch-icon" href="/iconos/cocina-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#111418;color:#f4f1ea;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none}
#entrar{min-height:100vh;display:grid;place-items:center;padding:24px}
#entrar .tarjeta{width:100%;max-width:360px;text-align:center;background:#fffaf0;color:#1d1d1f;border-radius:22px;padding:24px}
#entrar img{width:130px;height:130px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
#entrar h1{font-size:30px;font-weight:900;letter-spacing:3px;color:#1f7a43}
#entrar p{opacity:.7;margin:6px 0 18px}
#clave{width:100%;font-size:22px;text-align:center;padding:14px;border-radius:14px;border:2px solid #d8cfbf;background:#fff;outline:none}
.mantener{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.mantener input{width:22px;height:22px;accent-color:#1f7a43;flex:none}
#btnEntrar{width:100%;margin-top:14px;padding:16px;border-radius:14px;background:#2ecc71;color:#08210f;font-size:18px;font-weight:900}
#err{margin-top:10px;color:#a8242f;font-weight:700;min-height:20px}
header{position:sticky;top:0;z-index:5;background:#111418;border-bottom:1px solid #232a33;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:50%}
header h1{font-size:20px;font-weight:900;text-transform:uppercase;flex:1}
#btnAjustes{width:40px;height:40px;border-radius:50%;background:#1b2027;font-size:20px}
#panel{display:none}
</style>
</head>
<body>
<section id="entrar">
  <div class="tarjeta">
    <img id="logo" alt="" hidden>
    <h1>CAJA</h1>
    <p>Escribe la clave de la caja</p>
    <input id="clave" type="password" autocomplete="current-password" placeholder="Clave">
    <label class="mantener"><input type="checkbox" id="mantener" checked> Mantener sesión abierta en este celular</label>
    <button id="btnEntrar">Entrar</button>
    <div id="err"></div>
  </div>
</section>
<section id="panel">
  <header><img id="logoH" alt="" hidden><h1 id="nombre">Caja</h1><button id="btnAjustes" aria-label="Configuración">⚙️</button></header>
  <div id="pcaja"></div>
</section>
<script src="/caja-app.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const leer = (k) => { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } };
let CLAVE = leer("caja_clave") || "";
let caja = null;
fetch("/restaurante.json").then((r) => r.json()).then((R) => {
  document.title = "Caja · " + R.nombre; $("#nombre").textContent = "Caja " + R.nombre;
  if (R.caja !== true) location.replace("/cobros");      // sin el sistema de caja: la pantalla de cobro de mesas
  if (R.logo) { for (const id of ["#logo", "#logoH"]) { $(id).src = R.logo; $(id).hidden = false; } }
}).catch(() => {});
async function entrar() {
  CLAVE = $("#clave").value.trim() || CLAVE;
  if (!CLAVE) { $("#err").textContent = "Escribe la clave"; return; }
  $("#err").textContent = "Entrando…";
  let j; try { j = await (await fetch("/api/caja", { headers: { "x-clave": CLAVE }, cache: "no-store" })).json(); } catch (e) { j = { ok: false, error: "No hay conexión" }; }
  if (!j.ok) { $("#err").textContent = j.error || "No se pudo entrar"; return; }
  try {
    if ($("#mantener").checked) localStorage.setItem("caja_clave", CLAVE);
    else { localStorage.removeItem("caja_clave"); sessionStorage.setItem("caja_clave", CLAVE); }
  } catch (e) {}
  $("#entrar").style.display = "none"; $("#panel").style.display = "block";
  if (!caja) caja = montarCaja($("#pcaja"), () => CLAVE);
  caja.cargar();
}
$("#btnEntrar").onclick = entrar;
$("#clave").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
$("#btnAjustes").onclick = () => {
  if (confirm("¿Cerrar sesión de la caja en este celular? Se pedirá la clave otra vez.")) {
    try { localStorage.removeItem("caja_clave"); sessionStorage.removeItem("caja_clave"); } catch (e) {}
    location.replace("/caja?v=" + Date.now());
  }
};
if (CLAVE) { $("#clave").value = CLAVE; entrar(); }
</script>
</body>
</html>
