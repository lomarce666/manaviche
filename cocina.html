<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cocina</title>
<link rel="icon" type="image/png" href="/iconos/cocina-192.png">
<link rel="apple-touch-icon" href="/iconos/cocina-180.png">
<link rel="manifest" href="/cocina.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cocina">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#111418;color:#f4f1ea;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none}

/* Entrada */
#entrar{min-height:100vh;display:grid;place-items:center;padding:24px}
#entrar .caja{width:100%;max-width:360px;text-align:center}
#entrar h1{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
#entrar p{opacity:.7;margin:8px 0 22px}
#clave{width:100%;font-size:22px;text-align:center;padding:14px;border-radius:14px;border:2px solid #333a44;background:#1b2027;color:#fff;outline:none}
#clave:focus{border-color:#ffd166}
#btnEntrar{width:100%;margin-top:14px;padding:16px;border-radius:14px;background:#ffd166;color:#111;font-size:18px;font-weight:900}
.logoCocina{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
#entrar h1.rojo{color:#e03131;letter-spacing:3px}
header .logoMini{width:38px;height:38px;border-radius:50%;flex:none}
#errEntrar{color:#ff6b6b;margin-top:12px;min-height:20px;font-weight:700}

/* Panel */
#panel{display:none}
header{position:sticky;top:0;z-index:5;background:#111418;border-bottom:1px solid #232a33;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:900;text-transform:uppercase;flex:1;min-width:140px}
.dato{background:#1b2027;border-radius:12px;padding:6px 12px;font-size:14px;opacity:.95}
.dato b{font-size:18px;color:#ffd166}
.pestanas [hidden]{display:none!important}
.grupoPago{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.2)}
.grupoPago:first-of-type{border-top:0;padding-top:0}
.lpago{display:flex;justify-content:space-between;gap:8px;font-size:14px;opacity:.85;padding-left:22px}
#barraAjuste{align-items:center;gap:12px;max-width:760px;margin:14px auto 0;padding:0 16px}
#barraAjuste button{padding:10px 14px;border-radius:12px;background:#2a313b;color:#e6e9ee;font-weight:900}
#barraAjuste b{flex:1;font-size:18px}
#barraAjuste span{font-size:13px;opacity:.6}
.mantener{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.mantener input{width:22px;height:22px;accent-color:#ffd166;flex:none}
#btnAjustes{width:40px;height:40px;border-radius:50%;background:#1b2027;font-size:20px;flex:none}
#estado{font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px;background:#16351f;color:#6ee7a0}
#estado.mal{background:#4a1515;color:#ff8a8a}
#avisoSonido{display:none;margin:12px 16px 0;padding:14px;border-radius:14px;background:#e63946;color:#fff;font-weight:900;text-align:center;font-size:17px}
#avisoSonido.ver{display:block;animation:latir 1s infinite}
@keyframes latir{50%{opacity:.6}}

main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.vacio{grid-column:1/-1;text-align:center;opacity:.55;padding:60px 0;font-size:18px}
.vacio b{display:block;font-size:46px;margin-bottom:8px}

.tarjeta{background:#1b2027;border-radius:18px;padding:16px;border:3px solid transparent}
.tarjeta.nuevo{border-color:#e63946;background:#2a1517;animation:brillo 1.2s infinite}
@keyframes brillo{50%{border-color:#ff9aa2}}
.tarjeta.preparando{border-color:#f2b84b}
.tarjeta.tarde{border-color:#ff6b6b}
.tarjeta.aviso{background:#16263a;border-color:#4ea1ff}
.tarjeta.aviso.nuevo{background:#132a45}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-size:28px;font-weight:900}
.mesa{font-size:22px;font-weight:900;background:#ffd166;color:#111;padding:2px 10px;border-radius:10px}
.meta{font-size:14px;opacity:.75;margin-top:4px}
.items{list-style:none;margin:12px 0 0;font-size:18px;line-height:1.5}
.items b{color:#ffd166}
.nota{margin-top:10px;background:#3a2f12;color:#ffe29a;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700}
.total{margin-top:10px;font-size:15px;opacity:.8}
.acciones{display:flex;gap:10px;margin-top:14px}
.acciones button{flex:1;padding:16px;border-radius:14px;font-size:18px;font-weight:900}
.b-recibido{background:#e63946;color:#fff}
.b-listo{background:#2a313b;color:#9aa3ad}
.b-listo.completo{background:#2ecc71;color:#08210f;animation:latir 1.2s infinite}
.items li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #2a313b}
.items li:last-child{border:none}
.items li .nmI{flex:1}
.items li.hecho .nmI{opacity:.45;text-decoration:line-through}
.vistos{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.visto{width:42px;height:42px;border-radius:10px;border:3px solid #4a5563;background:#111418;color:transparent;font-size:24px;font-weight:900;display:grid;place-items:center}
.visto.si{background:#2ecc71;border-color:#2ecc71;color:#08210f}
.faltan{font-size:14px;opacity:.75;margin-top:8px;text-align:center}
.b-ok{background:#4ea1ff;color:#06203d}
.titulo-aviso{font-size:24px;font-weight:900;margin-top:6px}
/* Pestañas */
.pestanas{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.pestanas button{flex:1 0 auto;white-space:nowrap;padding:12px;border-radius:12px;background:#1b2027;color:#cfd6df;font-size:16px;font-weight:800}
.pestanas button.on{background:#ffd166;color:#111}
.pestanas .cuenta{display:inline-block;min-width:24px;padding:0 6px;margin-left:6px;border-radius:99px;background:rgba(0,0,0,.25);font-size:14px}
.pestanas button.alerta:not(.on){background:#e63946;color:#fff;animation:latir 1s infinite}
/* Aviso flotante de mesero / cuenta */
#avisos{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:40;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:100%;max-width:460px;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.45);animation:entraToast .35s cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.toast.mesero{background:#4ea1ff;color:#06203d}
.toast.cuenta{background:#ffd166;color:#2b1d00}
.toast .ic{font-size:40px;line-height:1}
.toast b{display:block;font-size:24px;font-weight:900}
.toast span{font-size:16px;font-weight:700}
.toast.sale{animation:saleToast .4s ease forwards}
@keyframes entraToast{from{transform:translateY(-120%);opacity:0}}
@keyframes saleToast{to{transform:translateY(-120%);opacity:0}}
/* Día de trabajo */
#dia{display:none;padding:16px;max-width:760px;margin:0 auto}
.hoja{background:#1b2027;border-radius:18px;padding:18px;margin-bottom:14px}
.hoja h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.fechaGrande{font-size:26px;font-weight:900;margin-top:6px}
.sub2{opacity:.7;font-size:14px;margin-top:4px}
.cifras{display:flex;gap:10px;margin-top:14px}
.cifras div{flex:1;background:#111418;border-radius:14px;padding:12px;text-align:center}
.cifras b{display:block;font-size:28px;color:#ffd166}
.cifras span{font-size:13px;opacity:.75}
.bGrande{display:block;width:100%;margin-top:12px;padding:17px;border-radius:14px;font-size:18px;font-weight:900}
.bAzul{background:#4ea1ff;color:#06203d}
.bRojo{background:#e63946;color:#fff}
.bVerde{background:#2ecc71;color:#08210f}
.bGris{background:#2a313b;color:#e6e9ee}
.campoFecha{width:100%;margin-top:12px;font-size:20px;padding:12px;border-radius:12px;border:2px solid #333a44;background:#111418;color:#fff}
.dias .d{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #2a313b;cursor:pointer}
.dias .d:last-child{border:none}
.dias .d .f{flex:1;font-weight:700}
.dias .d .f small{display:block;font-weight:400;opacity:.6;text-transform:none}
.dias .d .t{font-weight:900;color:#6ee7a0}
.dias .d .x{background:none;color:#ff8a8a;font-size:20px;padding:4px 8px}
.borrarFila{display:flex;gap:10px;margin-top:12px}
.filtroF{margin-top:10px}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapidos button{flex:1 0 auto;padding:9px 10px;border-radius:10px;background:#111418;color:#cfd6df;font-weight:800;font-size:14px}
.rapidos button.on{background:#4ea1ff;color:#06203d}
.rangoF{display:flex;gap:10px;margin-top:10px}
.rangoF label{flex:1;font-size:13px;opacity:.85;font-weight:700}
.rangoF input{display:block;width:100%;margin-top:4px;font-size:17px;padding:10px;border-radius:10px;border:2px solid #333a44;background:#111418;color:#fff;color-scheme:dark}
.quitarF{background:#2a313b;color:#e6e9ee;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:800;margin-left:6px}
.borrarFila button{flex:1;padding:12px;border-radius:12px;background:#2a1517;color:#ff8a8a;font-weight:800;font-size:15px}
/* Reporte de caja */
#reporte{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
#reporte.ver{display:flex}
.caja{background:#fffaf0;color:#1d1d1f;width:100%;max-width:520px;border-radius:18px;padding:20px;margin:auto 0}
.caja h3{font-size:24px;font-weight:900}
.caja .fechaR{font-weight:700;margin-top:2px}
.caja .hrs{color:#6b6458;font-size:14px;margin-top:4px}
.caja .grandes{display:flex;gap:8px;margin-top:14px}
.caja .grandes div{flex:1;background:#0d3b4f;color:#fff;border-radius:12px;padding:10px;text-align:center}
.caja .grandes b{display:block;font-size:22px;color:#ffd166}
.caja .grandes span{font-size:12px;opacity:.85}
.caja h4{margin-top:18px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#7a7266}
.caja table{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}
.caja th{text-align:left;font-size:12px;color:#7a7266;border-bottom:2px solid #e2d8c6;padding:5px 4px}
.caja td{padding:7px 4px;border-bottom:1px dashed #e2d8c6}
.caja .r{text-align:right;white-space:nowrap}
.caja .totF td{border:none;font-weight:900;font-size:18px;padding-top:10px}
.caja .alerta{margin-top:12px;background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px;font-weight:700;font-size:14px}
.caja .botones{margin-top:18px;display:grid;gap:10px}
/* Carta y estadísticas */
#carta,#stats{display:none;padding:16px;max-width:760px;margin:0 auto}
.pl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 2px;border-bottom:1px solid #2a313b}
.pl:last-child{border:none}
.pl .nm{flex:1;min-width:150px;font-weight:800;font-size:17px}
.pl .nm small{display:block;font-weight:400;opacity:.6;font-size:13px}
.pl.ago .nm{opacity:.5;text-decoration:line-through}
.pl input{width:86px;font-size:18px;padding:8px;border-radius:10px;border:2px solid #333a44;background:#111418;color:#fff;text-align:right}
.pl button{padding:10px 12px;border-radius:10px;font-weight:800;font-size:14px;background:#2a313b;color:#e6e9ee}
.pl .agoB2{flex:1 0 100%;padding:13px;border-radius:12px;font-size:16px;font-weight:900;background:#4a1515;color:#ffb3b3}
.pl .agoB2.ago{background:#16351f;color:#6ee7a0}
.estAgo{display:inline-block;margin-top:4px;background:#a8242f;color:#fff;font-size:12px;font-weight:900;padding:3px 8px;border-radius:6px}
.estAgo.disp{background:#1f7a43}
.pl.ago .nm .estAgo{opacity:1}
.pl button.agoB{background:#4a1515;color:#ff8a8a}
.pl button.agoB.si{background:#16351f;color:#6ee7a0}
.pl button.estB.si{background:#ffd166;color:#111}
.campoTxt{width:100%;margin-top:10px;font-size:17px;padding:12px;border-radius:12px;border:2px solid #333a44;background:#111418;color:#fff}
.barra{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.barra .et{width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.barra .bg{flex:1;background:#111418;border-radius:8px;height:22px;overflow:hidden}
.barra .bg i{display:block;height:100%;background:#ffd166;border-radius:8px}
.barra .v{width:84px;flex:none;text-align:right;font-weight:800}
.rango{display:flex;gap:8px;margin-bottom:12px}
.rango button{flex:1;padding:10px;border-radius:12px;background:#1b2027;color:#cfd6df;font-weight:800}
.rango button.on{background:#4ea1ff;color:#06203d}
.metodos{display:grid;gap:10px;margin-top:14px}
.metodos button{padding:18px;border-radius:14px;font-size:19px;font-weight:900;background:#0d3b4f;color:#fff}
.reparto2{margin-top:8px;font-size:14px;opacity:.85}
.grupoMesa{background:#161b21;border:1px solid #2a313b;border-radius:16px;padding:10px 12px;margin-bottom:14px}
.gmCab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px 8px;border-bottom:1px solid #2a313b;margin-bottom:4px}
.gmCab b:first-child{font-size:19px}
.gmCab span{font-size:14px;opacity:.85}
.pagoC{margin-top:8px;background:#16351f;color:#6ee7a0;border-radius:10px;padding:8px 10px;font-size:15px}
.toastOk{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2ecc71;color:#08210f;font-weight:900;font-size:18px;padding:14px 22px;border-radius:99px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #panel>*:not(#reporte){display:none!important}
  #reporte{position:static;display:block!important;background:none;padding:0;overflow:visible}
  .caja{max-width:none;border-radius:0;padding:0}
  .caja .botones,.noImprimir{display:none!important}
}
/* Mesas (cuentas abiertas) */
#mesas{display:none;padding:16px}
#mesas .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cuentaM{background:#1b2027;border-radius:18px;padding:16px;border:3px solid #2a313b}
.cuentaM .cab2{display:flex;justify-content:space-between;align-items:center}
.cuentaM .tot{font-size:28px;font-weight:900;color:#ffd166}
.cuentaM ul{list-style:none;margin-top:10px;font-size:16px;line-height:1.6}
.cuentaM li{display:flex;justify-content:space-between;gap:8px}
.cuentaM li span:last-child{opacity:.8}
.cuentaM .meta2{font-size:13px;opacity:.65;margin-top:6px}
.listaCobro{border-color:#2ecc71;box-shadow:0 0 0 2px rgba(46,204,113,.25)}
.b-cobrar{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:#2ecc71;color:#08210f;font-size:17px;font-weight:900}
.adic{display:inline-block;background:#4ea1ff;color:#06203d;font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:middle}
.ctaMesa{margin-top:6px;font-size:14px;color:#9fd0ff;font-weight:700}
/* Preparados */
#preparados{display:none;padding:16px}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.resumen div{flex:1;min-width:140px;background:#16351f;border-radius:16px;padding:14px;text-align:center}
.resumen b{display:block;font-size:30px;color:#6ee7a0}
.resumen span{font-size:14px;opacity:.8}
.fila{display:flex;gap:12px;align-items:flex-start;background:#1b2027;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fila .n{font-size:20px;font-weight:900;min-width:52px}
.fila .det{flex:1;font-size:15px;line-height:1.45}
.fila .det small{display:block;opacity:.65;font-size:13px}
.fila .monto{font-weight:900;font-size:18px;color:#ffd166;text-align:right}
.fila{cursor:pointer}
.fila .ver{display:inline-block;margin-top:6px;color:#4ea1ff;font-weight:800;font-size:14px}
#detalle{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px}
#detalle.ver{display:flex}
.ticket{background:#fffaf0;color:#1d1d1f;width:100%;max-width:380px;border-radius:18px;padding:20px;max-height:90vh;overflow:auto;font-size:16px}
.ticket h3{font-size:26px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.ticket .m{background:#0d3b4f;color:#fff;font-size:16px;padding:4px 10px;border-radius:10px}
.ticket .hrs{color:#6b6458;font-size:14px;margin-top:6px;line-height:1.5}
.ticket table{width:100%;border-collapse:collapse;margin-top:14px}
.ticket th{text-align:left;font-size:12px;text-transform:uppercase;color:#7a7266;border-bottom:2px solid #e2d8c6;padding:6px 4px}
.ticket td{padding:8px 4px;border-bottom:1px dashed #e2d8c6;vertical-align:top}
.ticket .d{text-align:right;white-space:nowrap}
.ticket .tot td{border:none;font-size:20px;font-weight:900;padding-top:12px}
.ticket .nt{margin-top:12px;background:#fff3cd;border-radius:10px;padding:8px 10px;font-weight:700}
.ticket .cerrar{width:100%;margin-top:16px;padding:14px;border-radius:12px;background:#0d3b4f;color:#fff;font-weight:900;font-size:17px}
.fila .volver{display:block;margin-top:6px;background:none;color:#9aa4b1;font-size:12px;text-decoration:underline;padding:0}
</style>
</head>
<body>

<section id="entrar">
  <div class="caja">
    <div id="iconoEntrar" style="font-size:54px">👨‍🍳</div>
    <h1 id="nombreEntrar">Cocina</h1>
    <p>Escribe la clave de la cocina</p>
    <input id="clave" type="password" autocomplete="current-password" placeholder="Clave">
    <label class="mantener"><input type="checkbox" id="mantener" checked> Mantener sesión abierta en este celular</label>
    <button id="btnEntrar">Entrar y activar sonido 🔔</button>
    <div id="errEntrar"></div>
  </div>
</section>

<section id="panel">
  <header>
    <img class="logoMini" id="logoHeader" alt="" hidden>
    <h1 id="nombre">Cocina</h1>
    <span class="dato">Día: <b id="hoyN">0</b> pedidos</span>
    <span id="estado">● En línea</span>
    <button id="btnAjustes" aria-label="Configuración">⚙️</button>
  </header>
  <div id="avisoSonido">🔇 Toca cualquier parte de la pantalla para activar el sonido</div>
  <nav class="pestanas">
    <button id="tabDia">📅 Día</button>
    <button id="tabPend">🔥 Pedidos<span class="cuenta" id="cPend">0</span></button>
    <button id="tabMesas">🧾 Mesas por cobrar<span class="cuenta" id="cMesas">0</span></button>
    <button id="tabPrep">✅ Pedidos preparados<span class="cuenta" id="cPrep">0</span></button>
    <button id="tabCaja" hidden>💵 Caja</button>
    <button id="tabStats" hidden>📊 Estadísticas</button>
    <button id="tabCarta" hidden>✏️ Editar carta</button>
  </nav>
  <main id="lista"><div class="vacio"><b>✅</b>Sin pedidos pendientes</div></main>
  <section id="preparados"></section>
  <section id="mesas"></section>
  <section id="dia"></section>
  <section id="carta"></section>
  <div id="barraAjuste" style="display:none"><button data-volverdia>⬅ Volver</button><b></b><span>⚙️ Configuración</span></div>
  <section id="stats"></section>
  <section id="pcaja" style="display:none"></section>
  <div id="reporte" role="dialog"><div class="caja" id="caja"></div></div>
  <div id="avisos" aria-live="assertive"></div>
  <div id="detalle" role="dialog"><div class="ticket" id="ticket"></div></div>
</section>

<script src="/caja-app.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const guardar = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leer = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const leerSes = k => { try { return sessionStorage.getItem(k); } catch(e){ return null; } };
// "Mantener sesión abierta": la clave queda guardada solo en este celular; si no, se pide al volver a abrir
let CLAVE = leer("cocina_clave") || leerSes("cocina_clave") || "";
let datos = { pedidos: [] }, vistos = new Set(), primeraCarga = true;

let NOMBRE = "";
fetch("/restaurante.json").then(r=>r.json()).then(R=>{
  NOMBRE = R.nombre;
  $("#tabCaja").hidden = R.caja !== true;      // la caja es opcional: "caja": true en restaurante.json
  document.title = "Cocina · " + R.nombre;
  $("#nombre").textContent = "Cocina " + R.nombre;
  $("#nombreEntrar").textContent = "Cocina " + R.nombre;
  if (R.logo) {
    $("#iconoEntrar").outerHTML = `<img class="logoCocina" src="${R.logo}" alt="${R.nombre}">`;
    $("#nombreEntrar").textContent = "Cocina"; $("#nombreEntrar").classList.add("rojo");
    const lh = $("#logoHeader"); lh.src = R.logo; lh.hidden = false;
  }
}).catch(()=>{});

/* ---------- Sonido (el iPhone exige un toque para activarlo) ---------- */
// La alarma es un archivo de sonido creado aquí mismo (3 pitidos). En iPhone un
// <audio> suena aunque el celular esté en silencio; el "Web Audio" no.
function crearSonido(dur, notas, cuadrada){
  const hz = 22050, n = Math.floor(hz * dur), datos = new Int16Array(n);
  notas.forEach(([a,b,f])=>{
    for (let i = Math.floor(a*hz); i < Math.min(n, Math.floor(b*hz)); i++){
      const t = i / hz;
      const env = cuadrada ? Math.min(1, (t - a) * 60, (b - t) * 60) : Math.min(1, (t - a) * 40) * Math.exp(-(t - a) * 3.2);
      const onda = cuadrada ? Math.sign(Math.sin(2*Math.PI*f*t)) : Math.sin(2*Math.PI*f*t);
      datos[i] = Math.max(-32767, Math.min(32767, datos[i] + Math.round(onda * (cuadrada ? 0.55 : 0.7) * env * 32767)));
    }
  });
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const txt = (o,s)=>{ for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  txt(0,"RIFF"); v.setUint32(4,36+n*2,true); txt(8,"WAVE"); txt(12,"fmt "); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,hz,true); v.setUint32(28,hz*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); txt(36,"data"); v.setUint32(40,n*2,true);
  new Int16Array(buf, 44).set(datos);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
// Pedido nuevo: 3 pitidos fuertes (se repite hasta tocar "Recibido")
const alarma = new Audio(crearSonido(0.75, [[0,0.17,990],[0.25,0.42,990],[0.5,0.7,1320]], true));
// Mesero / cuenta: "ding-dong" suave que dura 3 segundos y no se repite
const timbre = new Audio(crearSonido(3, [[0,1,988],[0.5,1.5,784],[1,2,988],[1.5,2.5,784],[2,3,988]], false));
alarma.preload = timbre.preload = "auto";
let sonidoListo = false;

// Desbloquea el sonido SIN hacer ruido (el iPhone lo exige con un toque)
function activarSonido(){
  if (sonidoListo) return;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
  try {
    [alarma, timbre].forEach(a => { a.muted = true; });
    const r = Promise.all([alarma.play(), timbre.play()]);
    const bien = ()=>{ [alarma, timbre].forEach(a => { a.pause(); a.currentTime = 0; a.muted = false; }); sonidoListo = true; revisarSonido(); };
    r.then(bien).catch(err=>{ [alarma, timbre].forEach(a => { a.muted = false; }); if (err && err.name === "NotAllowedError") sonidoListo = false; revisarSonido(); });
  } catch(e){}
}
function sonarTimbre(){
  if (!sonidoListo) return;
  try { timbre.muted = false; timbre.currentTime = 0; const r = timbre.play(); if (r && r.catch) r.catch(()=>{}); } catch(e){}
}
// Suena SOLO cuando hay un pedido nuevo
function pitido(){
  if (!sonidoListo) return;
  try {
    alarma.muted = false; alarma.currentTime = 0;
    const r = alarma.play();
    // Solo si el iPhone de verdad bloqueó el sonido volvemos a pedir el toque
    if (r && r.catch) r.catch(err=>{ if (err && err.name === "NotAllowedError"){ sonidoListo = false; revisarSonido(); } });
  } catch(e){}
}
function revisarSonido(){
  $("#avisoSonido").classList.toggle("ver", !sonidoListo && $("#panel").style.display === "block");
}
$("#avisoSonido").onclick = ()=>activarSonido();
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ cargar(); pedirPantallaEncendida(); } });

// La alarma suena cada 2.5 s mientras haya algo sin recibir
setInterval(()=>{
  const pendientes = datos.pedidos.filter(p => p.estado === "nuevo" && p.tipo === "pedido").length;
  if (pendientes){
    pitido();
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    document.title = (document.title.startsWith("🔴") ? "" : "🔴 ") + document.title.replace(/^🔴 /,"");
  } else document.title = document.title.replace(/^🔴 /,"");
  revisarSonido();
}, 2500);

/* ---------- Mantener la pantalla encendida ---------- */
let bloqueo = null;
async function pedirPantallaEncendida(){
  try { if ("wakeLock" in navigator && !bloqueo) { bloqueo = await navigator.wakeLock.request("screen"); bloqueo.addEventListener("release", ()=>{ bloqueo = null; }); } } catch(e){}
}

// Dónde va el pedido: mesa, para llevar o mostrador (ventas de caja)
function dondeTxt(p){ return p.para === "llevar" ? "🥡 Para llevar" : p.para === "mostrador" ? "🧍 Mostrador" : `Mesa ${p.mesa}`; }

/* ---------- Entrar ---------- */
async function entrar(){
  activarSonido();
  CLAVE = $("#clave").value.trim() || CLAVE;
  $("#errEntrar").textContent = "Entrando…";
  const ok = await cargar();
  if (ok === "clave"){ $("#errEntrar").textContent = "Clave incorrecta"; return; }
  if (ok === false){ $("#errEntrar").textContent = "No hay conexión. Intenta de nuevo."; return; }
  if ($("#mantener").checked) guardar("cocina_clave", CLAVE);
  else { try { localStorage.removeItem("cocina_clave"); sessionStorage.setItem("cocina_clave", CLAVE); } catch(e){} }
  $("#entrar").style.display = "none"; $("#panel").style.display = "block";
  pedirPantallaEncendida(); revisarSonido(); verVista("dia");
}
$("#btnEntrar").onclick = entrar;
$("#clave").addEventListener("keydown", e=>{ if (e.key === "Enter") entrar(); });
if (CLAVE) $("#clave").value = CLAVE;

/* ---------- ⚙️ Configuración: cerrar sesión ---------- */
$("#btnAjustes").onclick = () => abrirReporte(`<h3>⚙️ Configuración</h3>
  <div class="botones">
  <button class="bGrande bAzul" data-ajuste="stats">📊 Estadísticas</button>
  <button class="bGrande bAzul" data-ajuste="carta">✏️ Editar carta</button></div>
  <div class="hrs" style="margin-top:14px">${leer("cocina_clave") ? "La sesión está abierta en este celular: entra sin pedir la clave." : "La clave se pedirá la próxima vez que abras la cocina."}</div>
  <div class="botones"><button class="bGrande bRojo" id="cerrarSesion">🚪 Cerrar sesión</button>
  <button class="bGrande bGris" data-cerrar>Volver</button></div>`);
document.addEventListener("click", e => {
  const aj = e.target.closest("[data-ajuste]");
  if (aj){ cerrarReporte(); verVista(aj.dataset.ajuste); scrollTo({ top: 0 }); return; }
  if (e.target.closest("[data-volverdia]")){ verVista("dia"); return; }
  if (e.target.id !== "cerrarSesion") return;
  try { localStorage.removeItem("cocina_clave"); sessionStorage.removeItem("cocina_clave"); } catch(e){}
  CLAVE = ""; location.replace("/cocina?v=" + Date.now());      // vuelve a pedir la clave
});

/* ---------- Notificación de mesero / cuenta ---------- */
function mostrarAviso(p){
  const t = document.createElement("div");
  const cuenta = p.tipo === "cuenta";
  t.className = "toast " + (cuenta ? "cuenta" : "mesero");
  t.innerHTML = `<div class="ic">${cuenta ? "🧾" : "🙋"}</div><div><b>MESA ${p.mesa}</b><span>${cuenta ? `Está pidiendo la cuenta${p.cuenta_total != null ? " · $" + Number(p.cuenta_total).toFixed(2) : ""}` : "Está llamando al mesero"}</span></div>`;
  $("#avisos").appendChild(t);
  sonarTimbre();
  if (navigator.vibrate) navigator.vibrate([300,150,300]);
  const quitar = ()=>{ if (!t.parentNode) return; t.classList.add("sale"); setTimeout(()=>t.remove(), 400); };
  t.onclick = quitar;
  setTimeout(quitar, 10000);
}

/* ---------- Leer pedidos ---------- */
async function cargar(){
  try {
    const r = await fetch("/api/cocina", { headers: { "x-clave": CLAVE }, cache: "no-store" });
    if (r.status === 401) return "clave";
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    // Avisos nuevos de mesero / cuenta: notificación de 10 s con timbre de 3 s
    const nuevosAvisos = j.pedidos.filter(p => p.tipo !== "pedido" && !vistos.has(p.id));
    j.pedidos.forEach(p => vistos.add(p.id));
    if (!primeraCarga) nuevosAvisos.forEach(mostrarAviso);
    datos = j;
    $("#estado").textContent = "● En línea"; $("#estado").classList.remove("mal");
    pintar(); primeraCarga = false;
    return true;
  } catch(e){
    $("#estado").textContent = "● Sin conexión"; $("#estado").classList.add("mal");
    return false;
  }
}
setInterval(()=>{ if ($("#panel").style.display === "block") cargar(); }, 3000);

/* ---------- Dibujar tarjetas ---------- */
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const hace = ms => { const m = Math.floor((datos.ahora - ms) / 60000); return m < 1 ? "recién" : `hace ${m} min`; };
const hora = ms => new Date(ms).toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" });

let vista = "dia";
function verVista(v){
  vista = v;
  $("#tabDia").classList.toggle("on", v === "dia");
  $("#tabPend").classList.toggle("on", v === "pend"); $("#tabPrep").classList.toggle("on", v === "prep");
  $("#tabMesas").classList.toggle("on", v === "mesas");
  $("#mesas").style.display = v === "mesas" ? "block" : "none";
  $("#lista").style.display = v === "pend" ? "grid" : "none";
  $("#preparados").style.display = v === "prep" ? "block" : "none";
  $("#dia").style.display = v === "dia" ? "block" : "none";
  $("#tabCarta").classList.toggle("on", v === "carta"); $("#tabStats").classList.toggle("on", v === "stats");
  $("#carta").style.display = v === "carta" ? "block" : "none";
  $("#stats").style.display = v === "stats" ? "block" : "none";
  $("#tabCaja").classList.toggle("on", v === "caja"); $("#pcaja").style.display = v === "caja" ? "block" : "none";
  if (v === "caja"){ if (!window._caja) window._caja = montarCaja($("#pcaja"), () => CLAVE); window._caja.cargar(); }
  if (v === "dia") cargarDias();
  if (v === "carta") cargarCarta();
  if (v === "stats") cargarStats();
  $("#barraAjuste").style.display = v === "carta" || v === "stats" ? "flex" : "none";
  $("#barraAjuste b").textContent = v === "carta" ? "✏️ Editar carta" : "📊 Estadísticas";
  pintar();
}
$("#tabDia").onclick = ()=>verVista("dia");
$("#tabCaja").onclick = ()=>verVista("caja");
$("#tabPend").onclick = ()=>verVista("pend");
$("#tabPrep").onclick = ()=>verVista("prep");
$("#tabMesas").onclick = ()=>verVista("mesas");
$("#tabCarta").onclick = ()=>verVista("carta");
$("#tabStats").onclick = ()=>verVista("stats");

// Qué platos se pagan con cada forma (ej. 3 por transferencia y 1 en efectivo)
function bloquePagos(c){
  const P = c.porPago || []; if (!P.length) return "";
  if (P.length === 1) return `<div class="pagoC">${ICON_PAGO[P[0].metodo] || "💳"} ${esc(P[0].metodo)}: <b>$${Number(P[0].total).toFixed(2)}</b></div>`;
  return `<div class="pagoC"><div style="font-weight:900;margin-bottom:4px">Pagan por separado:</div>${P.map(x => `<div class="grupoPago"><b>${ICON_PAGO[x.metodo] || "💳"} ${esc(x.metodo)}: $${Number(x.total).toFixed(2)}</b>
    ${(x.platos || []).map(it => `<div class="lpago"><span>${it.cantidad} x ${esc(it.nombre)}</span><span>$${Number(it.total).toFixed(2)}</span></div>`).join("")}</div>`).join("")}</div>`;
}
function pintarMesas(){
  const L = porCobrarLista();
  $("#mesas").innerHTML = L.length ? `<div class="rejilla">${L.map(tarjetaCobro).join("")}</div>`
    : `<div class="vacio"><b>🧾</b>No hay mesas por cobrar<small style="display:block;font-size:15px;margin-top:6px;opacity:.7">Cuando una mesa tenga todos sus platos servidos aparece aquí</small></div>`;
}
function porCobrarLista(){
  return (datos.mesas || []).filter(c => c.pedidos.length && c.pedidos.every(p => p.estado === "listo")
    && !datos.pedidos.some(p => p.tipo === "pedido" && p.cuenta === c.id));
}
// Cobrar: 1) cómo pagó (el que eligió el cliente sale primero)  2) "Mesa N terminada"
const ICON_PAGO = { Efectivo: "💵", Transferencia: "📲", Tarjeta: "💳" };
function abrirCobro(id, mesa, total, pago){
  const cta = (datos.mesas || []).find(c => c.id === Number(id));
  const partes = (cta && cta.porPago || []).filter(x => x.total > 0);
  if (partes.length > 1){                       // parte en efectivo, parte por transferencia, etc.
    abrirReporte(`<h3>💵 Cobrar mesa ${mesa}</h3>
      <div class="fechaR" style="font-size:30px;margin-top:6px">$${total}</div>
      <div class="hrs">Esta mesa paga con varias formas:</div>
      <table>${partes.map(x => `<tr><td><b>${ICON_PAGO[x.metodo] || ""} ${esc(x.metodo)}</b></td><td class="r"><b>$${Number(x.total).toFixed(2)}</b></td></tr>
        ${(x.platos || []).map(it => `<tr><td style="padding-left:22px;font-size:14px;opacity:.8">${it.cantidad} x ${esc(it.nombre)}</td><td class="r" style="font-size:14px;opacity:.8">$${Number(it.total).toFixed(2)}</td></tr>`).join("")}`).join("")}</table>
      <div class="metodos"><button data-metodo="Mixto" data-id="${id}" data-mesa="${mesa}" style="background:#2ecc71;color:#08210f">✅ Cobrar así</button></div>
      <div class="hrs" style="margin-top:14px">¿Al final pagaron todo de una sola forma?</div>
      <div class="metodos">${["Efectivo", "Transferencia", "Tarjeta"].map(m => `<button data-metodo="${m}" data-id="${id}" data-mesa="${mesa}" style="padding:12px;font-size:16px">${ICON_PAGO[m]} Todo por ${m}</button>`).join("")}</div>
      <div class="botones"><button class="bGrande bGris" data-cerrar>Cancelar</button></div>`);
    return;
  }
  if (partes.length === 1 && partes[0].metodo !== "Sin elegir") pago = partes[0].metodo;
  const orden = ["Efectivo", "Transferencia", "Tarjeta"].sort((a, b) => (b === pago) - (a === pago));
  abrirReporte(`<h3>💵 Cobrar mesa ${mesa}</h3>
    <div class="fechaR" style="font-size:30px;margin-top:6px">$${total}</div>
    <div class="hrs">${pago ? `El cliente eligió <b>${esc(pago)}</b>.` : "¿Cómo pagó?"}</div>
    <div class="metodos">${orden.map(m => `<button data-metodo="${m}" data-id="${id}" data-mesa="${mesa}"${m === pago ? ` style="background:#2ecc71;color:#08210f"` : ""}>${ICON_PAGO[m]} Cobrar por ${m}${m === pago ? " ✓" : ""}</button>`).join("")}</div>
    <div class="botones"><button class="bGrande bGris" data-cerrar>Cancelar</button></div>`);
}
function confirmarTerminar(id, mesa, metodo){
  const cta = (datos.mesas || []).find(c => c.id === Number(id));
  const como = metodo === "Mixto" && cta ? cta.porPago.map(x => `${esc(x.metodo)} $${Number(x.total).toFixed(2)}`).join(" + ") : esc(metodo);
  abrirReporte(`<h3>🏁 Mesa ${mesa} terminada</h3>
    <div class="hrs" style="font-size:16px;margin-top:8px">Cobrado: <b>${como}</b>. La mesa ${mesa} ya acabó de comer.</div>
    <div class="alerta" style="background:#eef6f6;color:#0d3b4f">Al terminar se borra todo lo de esta mesa en el celular: el próximo cliente que escanee el QR de la mesa ${mesa} empieza desde cero.</div>
    <div class="botones">
      <button class="bGrande bVerde" data-terminar="${id}" data-mesa="${mesa}" data-metodo2="${esc(metodo)}">✅ Terminar mesa ${mesa}</button>
      <button class="bGrande bGris" data-cerrar>Volver</button></div>`);
}
$("#mesas").addEventListener("click", e=>{
  const b = e.target.closest("[data-cobrar2]"); if (!b) return;
  abrirCobro(b.dataset.cobrar2, b.dataset.mesa, b.dataset.total, b.dataset.pago);
});
async function cobrar(id, metodo, mesa){
  cerrarReporte();
  datos.mesas = (datos.mesas || []).filter(c => c.id !== id); pintar();
  try { await fetch("/api/cocina", { method: "POST", headers: { "Content-Type": "application/json", "x-clave": CLAVE }, body: JSON.stringify({ accion: "cobrar", id, metodo }) }); } catch(e){}
  mostrarListo(`✅ Mesa ${mesa} terminada · lista para nuevos clientes`);
  cargar();
}
function mostrarListo(txt){
  const t = document.createElement("div"); t.className = "toastOk"; t.textContent = txt;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

// Agrupa los pedidos preparados por cuenta de mesa: los clientes que vienen después a la misma mesa van en otro grupo
function gruposPorMesa(L){
  const g = new Map();
  for (const p of L){
    const k = p.cuenta != null ? "c" + p.cuenta : "m" + p.mesa + "-" + p.id;
    if (!g.has(k)) g.set(k, { mesa: p.mesa, para: p.para && p.para !== "mesa" ? p.para : null, cerrada: p.cuenta_cerrada || null, pedidos: [], total: 0, ultimo: 0 });
    const x = g.get(k); x.pedidos.push(p); x.total += Number(p.total); x.ultimo = Math.max(x.ultimo, p.actualizado || 0);
  }
  const lista = [...g.values()]; lista.forEach(x => x.pedidos.sort((a, b) => (a.numero || 0) - (b.numero || 0)));
  return lista.sort((a, b) => (!!a.cerrada - !!b.cerrada) || b.ultimo - a.ultimo);   // primero las que aún no pagan
}
function pintarPreparados(){
  const L = datos.listos || [];
  const suma = L.reduce((t,p)=>t + Number(p.total), 0);
  const platos = {};
  L.forEach(p => p.items.forEach(it => { platos[it.nombre] = (platos[it.nombre] || 0) + it.cantidad; }));
  const top = Object.entries(platos).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,c])=>`${c} ${esc(n)}`).join(" · ");
  $("#preparados").innerHTML = `
    <div class="resumen">
      <div><b>${L.length}</b><span>pedidos preparados hoy</span></div>
      <div><b>$${Number(datos.hoy?.total ?? suma).toFixed(2)}</b><span>Vendido por el menú</span></div>
    </div>
    ${top ? `<p style="opacity:.75;margin:0 2px 14px;font-size:14px">Más pedidos: ${top}</p>` : ""}
    ${L.length ? gruposPorMesa(L).map(g => `<div class="grupoMesa">
      <div class="gmCab"><b>${g.para ? dondeTxt(g) : `🍽️ Mesa ${g.mesa}`}</b><span>${g.para ? "✅ Pagado en caja" : g.cerrada ? `✅ Cobrada ${hora(g.cerrada)}` : "🧾 Por cobrar"} · ${g.pedidos.length} pedido${g.pedidos.length === 1 ? "" : "s"} · <b>$${g.total.toFixed(2)}</b></span></div>
      ${g.pedidos.map(p => `<div class="fila">
        <div class="n">#${p.numero ?? "—"}</div>
        <div class="det" data-detalle="${p.id}">${p.items.map(it => `${it.cantidad} x ${esc(it.nombre)}`).join(", ")}
          <small>Pedido ${hora(p.creado)} · entregado ${hora(p.actualizado)}${p.pago ? ` · ${ICON_PAGO[p.pago] || ""} ${esc(p.pago)}` : ""}</small>
          <span class="ver">🧾 Ver detalle</span></div>
        <div class="monto">$${Number(p.total).toFixed(2)}<button class="volver" data-id="${p.id}" data-estado="preparando">↩ Volver a pendientes</button></div>
      </div>`).join("")}</div>`).join("") : `<div class="vacio"><b>🍽️</b>Todavía no hay pedidos preparados hoy</div>`}`;
}

function tarjetaCobro(c){
  return `<div class="cuentaM listaCobro">
    <div class="cab2"><span class="mesa">MESA ${c.mesa}</span><span class="tot">$${Number(c.total).toFixed(2)}</span></div>
    <div style="margin-top:8px;font-size:17px;font-weight:900;color:#6ee7a0">✅ Todo servido · lista para cobrar</div>
    <div class="meta2">${c.pedidos.length} pedido(s) · desde ${hora(c.abierta)}</div>
    <ul>${c.platos.map(x => `<li><span><b>${x.cantidad} x</b> ${esc(x.nombre)}</span><span>$${Number(x.total).toFixed(2)}</span></li>`).join("")}</ul>
    ${(c.personas || []).length > 1 ? `<div class="reparto2">👥 ${c.personas.map(x => `${esc(x.nombre)}: $${Number(x.total).toFixed(2)}`).join(" · ")}</div>` : ""}
    ${bloquePagos(c)}

async function alTocar(e){
  const cb = e.target.closest("[data-cobrar2]");
  if (cb){ abrirCobro(cb.dataset.cobrar2, cb.dataset.mesa, cb.dataset.total, cb.dataset.pago); return; }
  // Visto de un plato servido
  const v = e.target.closest("[data-servir]");
  if (v){
    const p = datos.pedidos.find(x => x.id === Number(v.dataset.servir)); if (!p) return;
    const i = Number(v.dataset.i), k = Number(v.dataset.k);
    p.servidos = p.items.map((_, j) => Number((p.servidos || [])[j]) || 0);
    p.servidos[i] = k < p.servidos[i] ? k : k + 1;              // tocar uno marcado lo desmarca
    if (p.estado === "nuevo") p.estado = "preparando";
    pintar();
    try { await fetch("/api/cocina", { method: "POST", headers: { "Content-Type": "application/json", "x-clave": CLAVE }, body: JSON.stringify({ accion: "servir", id: p.id, i, n: p.servidos[i] }) }); } catch(e){}
    return;
  }
  const b = e.target.closest("[data-id]"); if (!b) return;
  if (b.dataset.faltan > 0 && !confirm(`Faltan ${b.dataset.faltan} plato(s) por marcar. ¿Marcar todo el pedido como servido?`)) return;
  const id = Number(b.dataset.id), estado = b.dataset.estado;
  // Cambia en pantalla al instante, y se guarda por detrás
  const p = datos.pedidos.find(x => x.id === id);
  if (p){ if (estado === "listo"){ datos.pedidos = datos.pedidos.filter(x => x.id !== id); if (p.tipo === "pedido") (datos.listos = datos.listos || []).unshift({ ...p, actualizado: Date.now() }); } else p.estado = estado; pintar(); }
  else if (datos.listos){ const q = datos.listos.find(x => x.id === id); if (q){ datos.listos = datos.listos.filter(x => x.id !== id); datos.pedidos.push({ ...q, tipo: "pedido", estado }); pintar(); } }
  try {
    await fetch("/api/cocina", { method: "POST", headers: { "Content-Type": "application/json", "x-clave": CLAVE }, body: JSON.stringify({ id, estado }) });
  } catch(e){}
  cargar();
}

const fechaLarga = f => { const [a,m,d] = String(f).split("-").map(Number); const t = new Date(a, m-1, d).toLocaleDateString("es-EC", { weekday:"long", day:"numeric", month:"long", year:"numeric" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const plata = n => "$" + Number(n || 0).toFixed(2);
let dias = [], pintadoDia = "", filtro = null, verDias = false;   // filtro = {desde, hasta, nombre} o null (últimos 7 días)
const fechaISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function rangoRapido(tipo){
  const h = new Date(); h.setHours(12, 0, 0, 0);
  const lunes = new Date(h); lunes.setDate(h.getDate() - ((h.getDay() + 6) % 7));
  if (tipo === "semana") return { desde: fechaISO(lunes), hasta: fechaISO(h), nombre: "Esta semana" };
  if (tipo === "pasada"){ const a = new Date(lunes); a.setDate(lunes.getDate() - 7); const b = new Date(lunes); b.setDate(lunes.getDate() - 1); return { desde: fechaISO(a), hasta: fechaISO(b), nombre: "Semana pasada" }; }
  if (tipo === "mes") return { desde: fechaISO(new Date(h.getFullYear(), h.getMonth(), 1)), hasta: fechaISO(h), nombre: "Este mes" };
  if (tipo === "mesPasado") return { desde: fechaISO(new Date(h.getFullYear(), h.getMonth() - 1, 1)), hasta: fechaISO(new Date(h.getFullYear(), h.getMonth(), 0)), nombre: "Mes pasado" };
  return null;
}

  return r.json().catch(()=>({ ok:false, error:"Sin conexión" }));
}

/* ---------- PDF del cierre de caja (archivo de verdad, sin imprimir) ---------- */
function pdfTexto(t){ // a WinAnsi: quita emojis y escapa
  return String(t).normalize("NFC").replace(/[^\x20-\x7E -ÿ]/g, "").replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
}
function crearPDF(lineas){            // lineas: [{t, b (negrita), s (tamaño)}]
  const W = 595, H = 842, M = 50; const paginas = []; let cur = [], y = H - M;
  for (const l of lineas){
    const s = l.s || 10, alto = s * 1.45;
    if (y - alto < M){ paginas.push(cur); cur = []; y = H - M; }
    y -= alto; if (l.t !== "") cur.push(`BT /${l.b ? "F2" : "F1"} ${s} Tf ${M} ${y.toFixed(1)} Td (${pdfTexto(l.t)}) Tj ET`);
    if (l.linea) cur.push(`0.6 w ${M} ${(y - 4).toFixed(1)} m ${W - M} ${(y - 4).toFixed(1)} l S`);
  }
  paginas.push(cur);
  const obj = []; const add = (s) => { obj.push(s); return obj.length; };
  const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>");
  const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>");
  const pagesId = obj.length + 1 + paginas.length * 2; const kids = [];
  for (const p of paginas){
    const cont = p.join("\n"); const c = add(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Contents ${c} 0 R /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> >>`));
  }
  add(`<< /Type /Pages /Kids [${kids.map(k => k + " 0 R").join(" ")}] /Count ${kids.length} >>`);
  const cat = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let out = "%PDF-1.4\n"; const offs = [];
  obj.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${obj.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("");
  out += `trailer\n<< /Size ${obj.length + 1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return new Blob([bytes], { type: "application/pdf" });
}
function descargarPDF(R){
  const col = (a, n, der) => { a = String(a); return der ? a.slice(0, n).padStart(n) : a.slice(0, n).padEnd(n); };
  const L = [], t = (x, b, s, linea) => L.push({ t: x, b, s, linea });
  t(`CIERRE DE CAJA - ${NOMBRE.toUpperCase()}`, true, 16); t(fechaLarga(R.fecha), false, 12);
  t(`Abierto ${hora(R.abierta)}${R.cerrada ? "  -  cerrado " + hora(R.cerrada) : ""}`, false, 10, true); t("");
  t(`Pedidos: ${R.pedidos}     Vendido: ${plata(R.total)}     Promedio: ${plata(R.promedio)}`, true, 11); t("");
  t("VENTAS POR PLATO", true, 11, true);
  t(col("Cant.", 6) + col("Plato", 40) + col("P. unit.", 10, 1) + col("Total", 12, 1), true);
  R.platos.forEach(x => t(col(x.cantidad, 6) + col(x.nombre, 40) + col(plata(x.precio), 10, 1) + col(plata(x.total), 12, 1)));
  t(col("Total vendido por el menu", 56) + col(plata(R.total), 12, 1), true, 10, true); t("");
  if (R.caja && (R.caja.fondo != null || R.caja.arqueo)){ t("CAJA (EFECTIVO)", true, 11, true);
    t(col("Fondo inicial", 50) + col(plata(R.caja.fondo || 0), 18, 1)); t(col("Cobrado en efectivo", 50) + col(plata(R.caja.efectivo), 18, 1));
    (R.caja.listaSalidas || []).forEach(m => t(col("- Salida: " + m.motivo, 50) + col("-" + plata(m.monto), 18, 1)));
    t(col("Deberia haber", 50) + col(plata(R.caja.esperado), 18, 1), true);
    if (R.caja.arqueo){ t(col("Contado al cerrar", 50) + col(plata(R.caja.arqueo.contado), 18, 1));
      t(col(R.caja.arqueo.diferencia === 0 ? "Cuadra" : R.caja.arqueo.diferencia > 0 ? "Sobra" : "FALTA", 50) + col(plata(Math.abs(R.caja.arqueo.diferencia)), 18, 1), true); }
    t(""); }
  if ((R.pagos || []).length){ t("COBROS POR FORMA DE PAGO", true, 11, true); t(col("Forma de pago", 40) + col("Mesas", 10, 1) + col("Total", 18, 1), true);
    R.pagos.forEach(x => t(col(x.metodo, 40) + col(x.cuentas, 10, 1) + col(plata(x.total), 18, 1))); t(""); }
  if (R.mesas.length){ t("POR MESA", true, 11, true); t(col("Mesa", 40) + col("Pedidos", 10, 1) + col("Total", 18, 1), true);
    R.mesas.forEach(m => t(col(typeof m.mesa === "string" ? m.mesa : "Mesa " + m.mesa, 40) + col(m.pedidos, 10, 1) + col(plata(m.total), 18, 1))); t(""); }
  if (R.lista.length){ t("PEDIDOS DEL DIA", true, 11, true); t(col("#", 8) + col("Hora", 14) + col("Mesa", 28) + col("Total", 18, 1), true);
    R.lista.forEach(p => t(col(p.numero ?? "-", 8) + col(hora(p.creado), 14) + col(p.para && p.para !== "mesa" ? (p.para === "llevar" ? "Para llevar" : "Mostrador") : p.mesa, 28) + col(plata(p.total), 18, 1))); t(""); }
  if ((R.anuladas || []).length){ t("VENTAS ANULADAS", true, 11, true); R.anuladas.forEach(a => t(col("#" + (a.numero ?? "-") + " " + (a.motivo || ""), 50) + col(plata(a.total), 18, 1))); t(""); }
  t(`Avisos: ${R.mesero} llamadas al mesero - ${R.cuenta} cuentas pedidas`, false, 9);
  const blob = crearPDF(L), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `Cierre-${NOMBRE}-${R.fecha}.pdf`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
}

let reporteActual = null;
function textoReporte(R){
  let t = `🧾 *Cierre de caja · ${NOMBRE}*\n${fechaLarga(R.fecha)}\n\n`;
  t += `Pedidos: ${R.pedidos}\n*Vendido por el menú: ${plata(R.total)}*\nPromedio: ${plata(R.promedio)}\n`;
  if ((R.pagos || []).length) t += `\n*Formas de pago*\n` + R.pagos.map(x => `• ${x.metodo}: ${plata(x.total)} (${x.cuentas})`).join("\n") + "\n";
  if (R.caja && (R.caja.fondo != null || R.caja.arqueo)) { t += `\n*Caja*\nFondo: ${plata(R.caja.fondo || 0)} · Efectivo: ${plata(R.caja.efectivo)}${R.caja.salidas ? ` · Salidas: −${plata(R.caja.salidas)}` : ""}\nDebería haber: ${plata(R.caja.esperado)}\n`;
    if (R.caja.arqueo) t += `Contado: ${plata(R.caja.arqueo.contado)} · ${R.caja.arqueo.diferencia === 0 ? "Cuadra ✅" : (R.caja.arqueo.diferencia > 0 ? "Sobra " : "Falta ") + plata(Math.abs(R.caja.arqueo.diferencia))}\n`; }
  if ((R.anuladas || []).length) t += `\n*Anuladas*\n` + R.anuladas.map(a => `• #${a.numero ?? "-"} ${plata(a.total)} — ${a.motivo || ""}`).join("\n") + "\n";
  if (R.platos.length) t += `\n*Por plato*\n` + R.platos.map(x => `• ${x.cantidad} x ${x.nombre} — ${plata(x.total)}`).join("\n");
  return t;
}
function abrirReporte(html, R){ reporteActual = R || null; $("#caja").innerHTML = html; $("#reporte").classList.add("ver"); $("#reporte").scrollTop = 0; }
const cerrarReporte = ()=> $("#reporte").classList.remove("ver");

$("#dia").addEventListener("change", e=>{
  if (e.target.id !== "fDesde" && e.target.id !== "fHasta") return;
  let a = $("#fDesde").value, b = $("#fHasta").value;
  if (!a && !b) return;
  if (!a) a = b; if (!b) b = a;                 // un solo día: elegir solo "Desde"
  if (a > b) [a, b] = [b, a];
  filtro = { desde: a, hasta: b, nombre: "" }; pintarDia();
});
$("#dia").addEventListener("click", async e=>{
  const r = e.target.closest("[data-rapido]"); if (r){ filtro = rangoRapido(r.dataset.rapido); pintarDia(); return; }
  if (e.target.id === "quitarF"){ filtro = null; pintarDia(); return; }
  if (e.target.id === "bVerDias"){ verDias = true; pintarDia(); return; }
  if (e.target.id === "bOcultarDias"){ verDias = false; filtro = null; pintarDia(); return; }
  const ir = e.target.closest("[data-ir]"); if (ir){ verVista(ir.dataset.ir); return; }
  if (e.target.id === "bNuevo"){
    const f = $("#fechaNueva").value;
    e.target.disabled = true; e.target.textContent = "Abriendo…";
    const j = await api("POST", { accion: "abrir", fecha: f });
    if (!j.ok) alert(j.error || "No se pudo abrir el día");
    pintadoDia = ""; await cargar(); return;
  }
  if (e.target.id === "bCulminar"){
    e.target.textContent = "Calculando…";
    const j = await api("POST", { accion: "previa" });
    pintadoDia = ""; pintarDia();
    if (!j.ok){ alert(j.error); return; }
    abrirReporte(htmlReporte(j.reporte, false) + `<div class="botones noImprimir">
      <button class="bGrande bVerde" id="bConfirmar">✅ Confirmar y guardar</button>
      <button class="bGrande bGris" data-cerrar>Volver</button></div>`, j.reporte);
    return;
  }
  if (e.target.id === "bSemana"){
    if (!confirm("¿Eliminar los días guardados de los últimos 7 días? No se puede deshacer.")) return;
    const j = await api("POST", { accion: "borrar", alcance: "semana" }); if (j.ok) alert(`Se eliminaron ${j.borrados} día(s).`);
    cargarDias(); return;
  }
  if (e.target.id === "bTodo"){
    const t = prompt("Esto elimina TODOS los días guardados y no se puede deshacer.\\nEscribe BORRAR para confirmar:");
    if ((t || "").trim().toUpperCase() !== "BORRAR") return;
    const j = await api("POST", { accion: "borrar", alcance: "todo" }); if (j.ok) alert(`Se eliminaron ${j.borrados} día(s).`);
    cargarDias(); return;
  }
  const x = e.target.closest("[data-borrar]");
  if (x){
    if (!confirm("¿Eliminar este día guardado? No se puede deshacer.")) return;
    await api("POST", { accion: "borrar", alcance: "dia", id: Number(x.dataset.borrar) }); cargarDias(); return;
  }
  const d = e.target.closest("[data-dia]");
  if (d){
    const j = await api("GET", null, "?dia=" + d.dataset.dia);
    if (j.ok) abrirReporte(htmlReporte(j.reporte, true) + `<div class="botones"><button class="bGrande bGris" data-cerrar>Cerrar</button></div>`, j.reporte);
  }
});
$("#reporte").addEventListener("click", async e=>{
  if (e.target.id === "reporte" || e.target.closest("[data-cerrar]")){ cerrarReporte(); return; }
  const m = e.target.closest("[data-metodo]"); if (m){ confirmarTerminar(Number(m.dataset.id), m.dataset.mesa, m.dataset.metodo); return; }
  const t = e.target.closest("[data-terminar]"); if (t){ cobrar(Number(t.dataset.terminar), t.dataset.metodo2, t.dataset.mesa); return; }
  if (e.target.closest("[data-imprimir]")){ if (reporteActual) descargarPDF(reporteActual); return; }
  if (e.target.closest("[data-wa]") && reporteActual){ window.open("https://wa.me/?text=" + encodeURIComponent(textoReporte(reporteActual)), "_blank"); return; }
  if (e.target.id === "bConfirmar"){
    e.target.disabled = true; e.target.textContent = "Guardando…";
    const j = await api("POST", { accion: "cerrar" });
    if (!j.ok){ alert(j.error || "No se pudo guardar"); e.target.disabled = false; e.target.textContent = "✅ Confirmar y guardar"; return; }
    // Día culminado: se cierra la ventana y se vuelve a la pestaña principal (Día), donde está "Nuevo día laboral"
    cerrarReporte();
    await cargar(); cargarDias();
    verVista("dia"); scrollTo({ top: 0, behavior: "smooth" });
    mostrarListo("✅ Día guardado · el menú quedó cerrado");
  }
});

/* ---------- Carta: agotados, precios y plato del día ---------- */
let carta = null;
async function cargarCarta(){
  const j = await api("GET", null, "?carta=1");
  if (!j.ok){ $("#carta").innerHTML = `<div class="vacio">No se pudo cargar la carta</div>`; return; }
  carta = j; pintarCarta();
}
function pintarCarta(){
  const P = carta.platos;
  $("#carta").innerHTML = `
    <div class="hoja">
      <h2>✏️ Editar carta · los cambios se ven al instante en el menú</h2>
      ${P.map(p => `<div class="pl${p.agotado ? " ago" : ""}" data-pl="${esc(p.id)}">
        <div class="nm">${esc(p.nombre)}<small>${esc(p.categoria)}${p.precio !== p.original ? ` · precio original ${plata(p.original)}` : ""}</small>
          ${p.agotado ? `<span class="estAgo">🚫 AGOTADO</span>` : `<span class="estAgo disp">✅ DISPONIBLE</span>`}</div>
        <input type="text" inputmode="decimal" autocomplete="off" value="${Number(p.precio).toFixed(2)}" aria-label="Precio">
        <button data-precio>Guardar $</button>
        <button class="agoB2${p.agotado ? " ago" : ""}" data-ago="${p.agotado ? 0 : 1}">${p.agotado ? "✅ Indicar que está disponible" : "🚫 Indicar que está agotado"}</button>
      </div>`).join("")}
      <div class="sub2" style="margin-top:10px">Los platos agotados se ven en el menú pero no se pueden pedir. Los precios nuevos se cobran desde el siguiente pedido.</div>
    </div>`;
}
$("#carta").addEventListener("click", async e=>{
  const fila = e.target.closest("[data-pl]"); if (!fila) return;
  const id = fila.dataset.pl;
  if (e.target.closest("[data-ago]")){ await api("POST", { accion: "plato", id, agotado: e.target.dataset.ago === "1" }); return cargarCarta(); }
  if (e.target.closest("[data-precio]")){
    const v = Number(String(fila.querySelector("input").value).trim().replace(",", "."));   // acepta 4,50 o 4.50
    const j = await api("POST", { accion: "plato", id, precio: v });
    if (!j.ok) alert(j.error || "No se pudo guardar"); else e.target.textContent = "✓ Guardado";
    return setTimeout(cargarCarta, 700);
  }
});

/* ---------- Estadísticas ---------- */
let rangoStats = 7;
async function cargarStats(){
  $("#stats").innerHTML = `<div class="vacio">Calculando…</div>`;
  const j = await api("GET", null, "?stats=" + rangoStats);
  if (!j.ok){ $("#stats").innerHTML = `<div class="vacio">No se pudieron cargar</div>`; return; }
  const barras = (lista, et, val, txt) => { const max = Math.max(...lista.map(val), 1);
    return lista.map(x => `<div class="barra"><span class="et">${esc(et(x))}</span><span class="bg"><i style="width:${(val(x) / max * 100).toFixed(1)}%"></i></span><span class="v">${txt(x)}</span></div>`).join(""); };
  const horas = j.porHora.map((n, h) => ({ h, n })).filter(x => x.n > 0);
  const pico = horas.slice().sort((a, b) => b.n - a.n)[0];
  const mejorDia = j.porDia.slice().sort((a, b) => b.total - a.total)[0];
  $("#stats").innerHTML = `
    <div class="rango">${[7, 30, 90].map(d => `<button data-rango="${d}" class="${d === rangoStats ? "on" : ""}">${d === 7 ? "Última semana" : d === 30 ? "Último mes" : "3 meses"}</button>`).join("")}</div>
    <div class="hoja"><h2>📊 Resumen</h2>
      <div class="cifras"><div><b>${j.pedidos}</b><span>pedidos</span></div><div><b>${plata(j.total)}</b><span>vendido</span></div><div><b>${plata(j.ticket)}</b><span>por pedido</span></div></div>
      ${pico ? `<div class="sub2" style="margin-top:12px">⏰ Hora más llena: <b>${pico.h}:00 a ${pico.h + 1}:00</b>${mejorDia ? ` · 🏆 Mejor día: <b>${mejorDia.nombre} ${mejorDia.dia.slice(8)}/${mejorDia.dia.slice(5, 7)}</b> (${plata(mejorDia.total)})` : ""}</div>` : ""}
    </div>
    ${j.pedidos ? `
    <div class="hoja"><h2>🍽️ Platos más vendidos</h2>${barras(j.platos.slice(0, 10), x => x.nombre, x => x.cantidad, x => `${x.cantidad} · ${plata(x.total)}`)}</div>
    <div class="hoja"><h2>📅 Ventas por día</h2>${barras(j.porDia, x => `${x.nombre} ${x.dia.slice(8)}/${x.dia.slice(5, 7)}`, x => x.total, x => plata(x.total))}</div>
    <div class="hoja"><h2>⏰ Pedidos por hora</h2>${barras(horas, x => `${x.h}:00`, x => x.n, x => `${x.n}`)}</div>`
    : `<div class="vacio"><b>📊</b>Todavía no hay pedidos en este periodo</div>`}`;
}
$("#stats").addEventListener("click", e=>{ const b = e.target.closest("[data-rango]"); if (b){ rangoStats = Number(b.dataset.rango); cargarStats(); } });

function verDetalle(p){
  const min = Math.max(0, Math.round((p.actualizado - p.creado) / 60000));
  $("#ticket").innerHTML = `
    <h3>Pedido #${p.numero ?? "—"} <span class="m">${dondeTxt(p).toUpperCase()}</span></h3>
    <div class="hrs">🕐 Pedido: ${hora(p.creado)}<br>🛎️ Entregado: ${hora(p.actualizado)} (${min} min)</div>
    <table>
      <tr><th>Cant.</th><th>Plato</th><th class="d">P. unit.</th><th class="d">Subtotal</th></tr>
      ${p.items.map(it => `<tr><td>${it.cantidad}</td><td>${esc(it.nombre)}</td><td class="d">$${Number(it.precio).toFixed(2)}</td><td class="d">$${(it.cantidad * it.precio).toFixed(2)}</td></tr>`).join("")}
      <tr class="tot"><td colspan="3">Total</td><td class="d">$${Number(p.total).toFixed(2)}</td></tr>
    </table>
    ${p.notas ? `<div class="nt">📝 ${esc(p.notas)}</div>` : ""}
    <button class="cerrar">Cerrar</button>`;
  $("#detalle").classList.add("ver");
}
$("#detalle").addEventListener("click", e=>{ if (e.target.id === "detalle" || e.target.closest(".cerrar")) $("#detalle").classList.remove("ver"); });

// Si ya había clave guardada, intenta entrar solo (el sonido se activa con el primer toque)
if (CLAVE) cargar().then(ok => { if (ok === true){ $("#entrar").style.display = "none"; $("#panel").style.display = "block"; revisarSonido(); pedirPantallaEncendida(); verVista("dia"); } });
document.addEventListener("click", activarSonido, { capture: true });
document.addEventListener("touchend", activarSonido, { capture: true });
})();
</script>
