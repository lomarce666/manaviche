<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú</title>
<meta name="description" content="Menú digital. Pide desde tu mesa.">
<meta name="theme-color" content="#0d3b4f">
<style>
:root{
  --amarillo:#ffd166;
  --crema:#fff7e6;
  --piel:#c98b5e;
  --piel-sombra:#a96f45;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;background:#0d3b4f}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--crema);overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* Pista invisible que da el largo al scroll (una pantalla por paso) */
.paso{height:100vh;height:100svh;scroll-snap-align:start}

/* Escenario fijo donde pasa toda la animación */
#escena{position:fixed;inset:0;overflow:hidden;background:#0d3b4f;pointer-events:none}
#escena *{pointer-events:none}
#escena .clic{pointer-events:auto}

/* ---------- Nombre del negocio ---------- */
#marca{position:absolute;left:0;right:0;top:50%;text-align:center;transform-origin:center top;will-change:transform}
#marca h1{font-size:clamp(46px,15vw,92px);font-weight:900;letter-spacing:-1px;line-height:1;color:var(--amarillo);text-transform:uppercase;display:inline-flex}
#marca h1 span{display:inline-block;opacity:0;transform:translateY(-120px) rotate(-20deg);animation:caer .7s cubic-bezier(.2,1.6,.4,1) forwards}
#marca .sub{margin-top:10px;font-size:16px;letter-spacing:4px;text-transform:uppercase;opacity:0;animation:aparecer .8s 1.2s forwards}
#marca .ola{display:block;margin:12px auto 0;width:160px;opacity:0;animation:aparecer .8s 1.4s forwards}
@keyframes caer{to{opacity:1;transform:none}}
@keyframes aparecer{to{opacity:1}}

#desliza{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom));text-align:center;font-size:14px;letter-spacing:1px;opacity:0;animation:aparecer .8s 1.8s forwards}
#desliza b{display:block;font-size:26px;margin-top:4px;animation:rebote 1.4s ease-in-out infinite}
@keyframes rebote{50%{transform:translateY(8px)}}

/* ---------- Platos ---------- */
.plato{position:absolute;inset:0}
.texto{position:absolute;left:24px;right:24px;top:calc(96px + env(safe-area-inset-top));opacity:0;visibility:hidden}
.num{font-size:13px;font-weight:700;letter-spacing:3px;opacity:.75}
.texto h2{font-size:clamp(34px,10.5vw,56px);font-weight:900;line-height:.98;margin-top:8px;text-transform:uppercase;letter-spacing:-.5px}
.texto p{font-size:15px;opacity:.85;margin-top:10px;max-width:420px}
.fila{display:flex;align-items:center;gap:14px;margin-top:16px}
.precio{background:var(--amarillo);color:#1d1d1f;font-weight:900;font-size:30px;padding:6px 16px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.pedir{border:2px solid var(--crema);color:var(--crema);background:transparent;font:inherit;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;text-decoration:none}

.mano{position:absolute;left:50%;bottom:-2vh;width:min(112vw,560px);margin-left:calc(min(112vw,560px) / -2);opacity:0;visibility:hidden}
.plato.vivo .mano,.plato.vivo .texto{visibility:visible;will-change:transform,opacity}
.plato:not(.vivo) .flotar,.plato:not(.vivo) .vapor path{animation-play-state:paused}
.mano.izq{transform-origin:20% 100%}
.mano.der{transform-origin:80% 100%}
.flotar{animation:flotar 3.2s ease-in-out infinite}
@keyframes flotar{50%{transform:translateY(-10px) rotate(-1deg)}}
.mano svg{width:100%;height:auto;display:block}
.izq svg{transform:scaleX(-1)}
.vapor path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:5;stroke-linecap:round;animation:vapor 2.6s ease-in-out infinite;opacity:0}
.vapor path:nth-child(2){animation-delay:.8s}
.vapor path:nth-child(3){animation-delay:1.6s}
@keyframes vapor{0%{opacity:0;transform:translateY(20px)}40%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

/* Puntitos de avance */
#puntos{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;opacity:0;transition:opacity .4s}
#puntos i{width:7px;height:7px;border-radius:50%;background:var(--crema);opacity:.35;transition:all .3s}
#puntos i.on{opacity:1;height:20px;border-radius:4px}

/* ---------- Final ---------- */
#final{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;opacity:0}
#final h2{font-size:clamp(38px,12vw,64px);font-weight:900;text-transform:uppercase;line-height:1;color:var(--amarillo)}
#final p{margin-top:12px;font-size:16px;opacity:.9}
.wa{display:inline-block;margin-top:26px;background:#25d366;color:#fff;font-weight:800;font-size:17px;padding:16px 26px;border-radius:99px;text-decoration:none;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.dir{margin-top:22px;font-size:14px;opacity:.8;line-height:1.5}
.dir a{color:var(--amarillo)}

/* ---------- Botón agregar ---------- */
.pedir{cursor:pointer;transition:transform .15s, background .2s, color .2s}
.pedir:active{transform:scale(.92)}
.pedir.listo{background:var(--crema);color:#1d1d1f}

/* ---------- Burbuja del carrito ---------- */
#burbuja{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;background:var(--amarillo);color:#1d1d1f;border:none;font-size:28px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:60;cursor:pointer;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
#burbuja.ver{transform:scale(1)}
#burbuja.salto{animation:salto .45s ease}
@keyframes salto{30%{transform:scale(1.25) rotate(-10deg)}60%{transform:scale(.92) rotate(6deg)}100%{transform:scale(1)}}
#contador{position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:#e63946;color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;border:3px solid #fff}
.volador{position:fixed;width:34px;height:34px;border-radius:50%;background:var(--amarillo);z-index:70;pointer-events:none;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* ---------- Ventana del pedido ---------- */
#sombra{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
#sombra.ver{opacity:1;pointer-events:auto}
#ventana{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fffaf0;color:#1d1d1f;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;z-index:90;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1,.3,1)}
#ventana.ver{transform:none}
.agarre{width:44px;height:5px;border-radius:9px;background:#d8d0c0;margin:0 auto 14px}
.cabeza{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cabeza h3{font-size:24px;font-weight:900;text-transform:uppercase}
.x{background:#efe7d8;border:none;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;color:#1d1d1f}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #e2d8c6;animation:entra .3s ease}
@keyframes entra{from{opacity:0;transform:translateX(20px)}}
.item .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px}
.item .nm small{color:#7a7266;font-size:13px}
.cant{display:flex;align-items:center;gap:8px}
.cant button{width:32px;height:32px;border-radius:50%;border:none;font-size:18px;font-weight:800;cursor:pointer}
.cant .menos{background:#efe7d8;color:#1d1d1f}
.cant .mas{background:#0d3b4f;color:#fff}
.cant span{min-width:16px;text-align:center;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:center;margin:16px 0 18px;font-size:18px;font-weight:800}
.total b{font-size:28px}
.mesa{background:#fff;border:2px dashed #f2b84b;border-radius:16px;padding:14px}
.mesa label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.mesa input{width:100%;font-size:26px;font-weight:900;text-align:center;padding:10px;border:2px solid #e2d8c6;border-radius:12px;outline:none;color:#0d3b4f;font-family:inherit}
.mesa input:focus{border-color:#0d3b4f}
.notas{width:100%;margin-top:10px;padding:10px 12px;border:2px solid #e2d8c6;border-radius:12px;font:inherit;font-size:15px;resize:none;outline:none}
.notas:focus{border-color:#0d3b4f}
#enviar{width:100%;margin-top:16px;padding:17px;border:none;border-radius:16px;font:inherit;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;background:#e63946;color:#fff;box-shadow:0 6px 0 #a8242f;transition:all .25s}
#enviar:disabled{background:#cfc7ba;color:#8a8275;box-shadow:0 6px 0 #b3ab9e;cursor:not-allowed}
#enviar:not(:disabled){animation:latido 1.6s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.03)}}
#enviar:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #a8242f}
.ayuda{text-align:center;font-size:13px;color:#7a7266;margin-top:10px}
.vaciar{display:block;margin:10px auto 0;background:none;border:none;color:#7a7266;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}

.mesa input.mal{border-color:#e63946;color:#e63946;animation:temblor .35s}
@keyframes temblor{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ayuda.error{color:#e63946;font-weight:700}

/* Ventanita "¿Estás en la mesa X?" */
#confirma{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
#confirma.ver{opacity:1;pointer-events:auto}
#confirma .caja{background:#fffaf0;color:#1d1d1f;border-radius:24px;padding:26px 22px 20px;width:100%;max-width:340px;text-align:center;transform:scale(.8);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
#confirma.ver .caja{transform:scale(1)}
#confirma .emoji{font-size:34px}
#confirma p{font-size:17px;font-weight:700;margin-top:6px}
#confirma .grande{font-size:84px;font-weight:900;line-height:1;color:#0d3b4f;margin:6px 0}
#confirma small{display:block;color:#7a7266;font-size:14px;margin-bottom:18px}
#confSi{width:100%;padding:15px;border:none;border-radius:14px;background:#e63946;color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #a8242f}
#confNo{width:100%;margin-top:10px;padding:12px;border:none;background:none;color:#0d3b4f;font:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}

#confSi:disabled{opacity:.75;cursor:wait}

/* Ventanita de resultado */
#resultado{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
#resultado.ver{opacity:1;pointer-events:auto}
#resultado .caja{background:#fffaf0;color:#1d1d1f;border-radius:24px;padding:26px 22px 20px;width:100%;max-width:340px;text-align:center;transform:scale(.8);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
#resultado.ver .caja{transform:scale(1)}
.grande-emoji{font-size:54px;animation:salto .6s ease}
#resultado h4{font-size:24px;font-weight:900;margin-top:6px;text-transform:uppercase}
#resultado p{font-size:15px;color:#4a443b;margin-top:8px;line-height:1.45}
#resultado .mesero{font-size:14px;color:#7a7266}
.btn-principal,.btn-wa{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none}
.btn-principal{background:#0d3b4f;color:#fff}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 5px 0 #179c4a}
.btn-secundario{margin-top:10px;background:none;border:none;color:#0d3b4f;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

/* Mensaje de confirmación */
#aviso{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:15px;z-index:100;transition:transform .4s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
#aviso.ver{transform:translate(-50%,0)}

.agotado{background:rgba(0,0,0,.25);color:var(--crema);font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px}
.mesa input.fija{background:#eef6f6;border-color:#0d3b4f}
.ticket{display:inline-block;margin-top:10px;background:#0d3b4f;color:#fff;font-weight:900;font-size:22px;padding:6px 16px;border-radius:12px;letter-spacing:1px}
#ayudaBtn{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:26px;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:60;cursor:pointer}
#ayudaPanel{position:fixed;inset:0;z-index:97;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
#ayudaPanel.ver{opacity:1;pointer-events:auto}
#ayudaPanel .caja{background:#fffaf0;color:#1d1d1f;border-radius:24px;padding:24px 22px 18px;width:100%;max-width:340px;text-align:center}
#ayudaPanel h4{font-size:22px;font-weight:900;text-transform:uppercase}
#ayudaPanel label{display:block;margin-top:14px;font-weight:700;font-size:14px}
#ayudaPanel input{width:110px;margin:8px auto 0;display:block;font-size:30px;font-weight:900;text-align:center;padding:6px;border:2px solid #e2d8c6;border-radius:12px;color:#0d3b4f;font-family:inherit}
#ayudaPanel .op{display:block;width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;background:#0d3b4f;color:#fff}
#ayudaPanel .op[data-tipo="cuenta"]{background:#e63946}
#ayudaPanel .op:disabled{opacity:.6}
#ayudaMsg{margin-top:10px;font-size:14px;color:#a8242f;min-height:18px}
#ayudaMsg a{color:#179c4a;font-weight:800}

@media (prefers-reduced-motion:reduce){
  #enviar:not(:disabled){animation:none}
  .flotar,.vapor path,#desliza b{animation:none}
}
</style>
</head>
<body>

<!-- Escenario animado -->
<div id="escena">
  <div id="marca">
    <h1 id="titulo"></h1>
    <div class="sub" id="eslogan"></div>
    <svg class="ola" viewBox="0 0 160 14"><path d="M2 7 Q 22 -3 42 7 T 82 7 T 122 7 T 158 7" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/></svg>
  </div>
  <div id="desliza">Desliza para ver el menú<b>↓</b></div>
  <div id="platos"></div>
  <div id="puntos"></div>
  <div id="final">
    <h2>¿Ya se te antojó?</h2>
    <p>Escríbenos y te lo tenemos listo.</p>
    <a class="wa clic" id="waFinal" target="_blank" rel="noopener">💬 Pedir por WhatsApp</a>
    <div class="dir" id="dir"></div>
  </div>
</div>

<!-- Carrito flotante -->
<button id="burbuja" aria-label="Ver mi pedido">🛒<span id="contador">0</span></button>

<!-- Ventana del pedido -->
<div id="sombra"></div>
<div id="ventana" role="dialog" aria-label="Tu pedido">
  <div class="agarre"></div>
  <div class="cabeza"><h3>Tu pedido</h3><button class="x" id="cerrar" aria-label="Cerrar">×</button></div>
  <div id="lista"></div>
  <div class="total"><span>Total</span><b id="total">$0</b></div>
  <div class="mesa">
    <label for="mesa" id="mesaLabel">🍽️ Mesa (especifique el número de su mesa)</label>
    <input id="mesa" type="text" inputmode="numeric" maxlength="2" placeholder="#" autocomplete="off">
    <textarea class="notas" id="notas" rows="2" placeholder="¿Alguna indicación? (sin cebolla, poco picante…)"></textarea>
  </div>
  <button id="enviar" disabled>Enviar a la cocina 👨‍🍳</button>
  <p class="ayuda" id="ayuda">Escribe tu número de mesa para enviar el pedido</p>
  <button class="vaciar" id="vaciar">Vaciar pedido</button>
</div>

<!-- Confirmación de mesa -->
<div id="confirma" role="alertdialog" aria-label="Confirmar mesa">
  <div class="caja">
    <div class="emoji">🍽️</div>
    <p>¿Estás en la mesa…</p>
    <div class="grande" id="confMesa">0</div>
    <small id="confDetalle"></small>
    <button id="confSi">✅ Sí, enviar a la cocina</button>
    <button id="confNo">Cambiar número</button>
  </div>
</div>

<!-- Resultado del envío -->
<div id="resultado" role="alertdialog"><div class="caja"></div></div>

<!-- Llamar mesero / pedir cuenta -->
<button id="ayudaBtn" aria-label="Llamar al mesero">🙋</button>
<div id="ayudaPanel" role="dialog" aria-label="Llamar al mesero">
  <div class="caja">
    <h4>¿En qué te ayudamos?</h4>
    <label for="ayudaMesa">Tu mesa</label>
    <input id="ayudaMesa" type="number" inputmode="numeric" min="1" placeholder="#">
    <button class="op" data-tipo="mesero">🙋 Llamar al mesero</button>
    <button class="op" data-tipo="cuenta">🧾 Pedir la cuenta</button>
    <p id="ayudaMsg"></p>
    <button class="btn-secundario" data-cerrar-ayuda>Cerrar</button>
  </div>
</div>

<div id="aviso"></div>

<!-- Pasos del scroll (se crean solos) -->
<div id="pista"></div>

<script>
(async function(){
/* =================================================================
   Los platos, precios, mesas y datos del restaurante están en
   restaurante.json  ←  para cambiar precios se edita ESE archivo.
   Aquí está el diseño y el funcionamiento del menú.
   ================================================================= */
let NEGOCIO;
try {
  const r = await fetch("/restaurante.json", { cache: "no-cache" });
  if (!r.ok) throw new Error("no existe");
  NEGOCIO = await r.json();
} catch (e) {
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;font-family:system-ui;background:#0d3b4f;color:#fff7e6"><div><div style="font-size:56px">🍽️</div><h1 style="margin-top:10px">Menú no disponible</h1><p style="opacity:.8;margin-top:8px">Intenta de nuevo en un momento o pide tu carta al mesero.</p></div></div>`;
  return;
}
const PLATOS = (NEGOCIO.platos || []).map((p, i) => ({ ...p, id: p.id || ("p" + i), comida: p.dibujo || "", fondo: p.fondo || "#2b4162" }));
const COLORES = NEGOCIO.colores || {};
if (COLORES.acento) document.documentElement.style.setProperty("--amarillo", COLORES.acento);
document.querySelector('meta[name="theme-color"]')?.setAttribute("content", COLORES.inicio || "#0d3b4f");


const FONDO_INICIO = COLORES.inicio || "#0d3b4f";
const $ = s => document.querySelector(s);
const precioTxt = n => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
const wa = txt => `https://wa.me/${NEGOCIO.whatsapp}?text=${encodeURIComponent(txt)}`;

/* ---------- Dibujos de la comida (SVG) ---------- */
const camaron = (x,y,r) => `<g transform="translate(${x} ${y}) rotate(${r})"><path d="M-9 4 A10 10 0 1 1 6 9" stroke="#f28c6b" stroke-width="7.5" fill="none" stroke-linecap="round"/><path d="M-5 -6 A6 6 0 0 1 4 -2" stroke="#ffd0bf" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M6 9 l7 3" stroke="#e0603e" stroke-width="4" stroke-linecap="round"/></g>`;
const cebolla = (x,y,r) => `<path transform="translate(${x} ${y}) rotate(${r})" d="M-9 0 q9 -7 18 0" stroke="#9b2c5a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
const hoja = (x,y) => `<ellipse cx="${x}" cy="${y}" rx="4.5" ry="3" fill="#3f8f3a" transform="rotate(${(x*7)%60} ${x} ${y})"/>`;
const cubo = (x,y,c,r=0) => `<rect x="${x-7}" y="${y-6}" width="14" height="12" rx="3" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`;
const bola = (x,y,rr,c,c2) => `<circle cx="${x}" cy="${y}" r="${rr}" fill="${c}"/><circle cx="${x-rr*.35}" cy="${y-rr*.35}" r="${rr*.3}" fill="${c2}" opacity=".6"/>`;
const choclo = (x,y) => `<circle cx="${x}" cy="${y}" r="9" fill="#f5c542"/><circle cx="${x}" cy="${y}" r="3.5" fill="#e0a82e"/>`;
const vapor = `<g class="vapor"><path d="M165 150 q-12 -18 0 -36 t0 -36"/><path d="M200 140 q-12 -18 0 -36 t0 -36"/><path d="M235 150 q-12 -18 0 -36 t0 -36"/></g>`;

function tazon(cuerpo, borde, salsa, dentro, caliente){
  return `${caliente?vapor:""}
  <path d="M92 192 C97 250 148 274 200 274 C252 274 303 250 308 192 Z" fill="${cuerpo}"/>

const cuenta = () => Object.values(carrito).reduce((a,b)=>a+b, 0);
const suma = () => Object.entries(carrito).reduce((t,[i,q])=>t + PLATOS[i].precio*q, 0);
const plata = n => "$" + n.toFixed(2);

function avisar(txt){
  const a = $("#aviso"); a.textContent = txt; a.classList.add("ver");

function volar(desde){
  const r = desde.getBoundingClientRect(), b = burbuja.getBoundingClientRect();
  const v = document.createElement("div");
  v.className = "volador"; v.textContent = "+1";
  v.style.left = (r.left + r.width/2 - 17) + "px"; v.style.top = (r.top + r.height/2 - 17) + "px";
  document.body.appendChild(v);
  const dx = (b.left + b.width/2) - (r.left + r.width/2), dy = (b.top + b.height/2) - (r.top + r.height/2);
  v.animate([
    { transform:"translate(0,0) scale(1)" },
    { transform:`translate(${dx*0.5}px, ${dy*0.5 - 90}px) scale(1.2)`, offset:.5 },
    { transform:`translate(${dx}px, ${dy}px) scale(.4)`, opacity:.6 }
  ], { duration:650, easing:"cubic-bezier(.5,0,.6,1)" }).onfinish = () => {
    v.remove(); burbuja.classList.remove("salto"); void burbuja.offsetWidth; burbuja.classList.add("salto");
  };
}

function refrescar(){
  const n = cuenta();
  $("#contador").textContent = n;
  burbuja.classList.toggle("ver", n > 0);
  $("#total").textContent = plata(suma());
  // botones de cada plato
  document.querySelectorAll(".pedir").forEach(b=>{
    const q = carrito[b.dataset.i] || 0;
    b.textContent = q ? `Agregado ✓ (${q})` : "Agregar +";
    b.classList.toggle("listo", q > 0);
  });
  // lista de la ventana
  $("#lista").innerHTML = Object.entries(carrito).map(([i,q])=>{
    const p = PLATOS[i];
    return `<div class="item">
      <div class="ic" style="background:${p.fondo}22">${ICONOS[p.comida]||"🍽️"}</div>
      <div class="nm"><b>${p.nombre}</b><small>${plata(p.precio)} c/u · ${plata(p.precio*q)}</small></div>
      <div class="cant"><button class="menos" data-menos="${i}" aria-label="Quitar uno">−</button><span>${q}</span><button class="mas" data-mas="${i}" aria-label="Agregar uno">+</button></div>
    </div>`;
  }).join("");
  if (!n) cerrarVentana();
  validar();
}

function validar(){
  const v = mesaIn.value.trim(), n = Number(v);
  const existe = v !== "" && Number.isInteger(n) && n >= 1 && n <= NEGOCIO.mesas;
  const ok = existe && cuenta() > 0;
  enviar.disabled = !ok;
  mesaIn.classList.toggle("mal", v !== "" && !existe);
  const ayuda = $("#ayuda");
  ayuda.classList.toggle("error", v !== "" && !existe);
  if (v === "") ayuda.textContent = "Escribe tu número de mesa para enviar el pedido";
  else if (!existe) ayuda.textContent = `⚠️ Esa mesa no existe. Tenemos mesas del 1 al ${NEGOCIO.mesas}`;
  else ayuda.textContent = `Mesa ${n} · ${cuenta()} plato(s) · ${plata(suma())}`;
}

function abrirVentana(){ ventana.classList.add("ver"); sombra.classList.add("ver"); document.documentElement.style.overflow = "hidden"; }
function cerrarVentana(){ ventana.classList.remove("ver"); sombra.classList.remove("ver"); document.documentElement.style.overflow = ""; }

document.addEventListener("click", e=>{

  const mas = e.target.closest("[data-mas]"), menos = e.target.closest("[data-menos]");
  if (mas){ carrito[mas.dataset.mas]++; refrescar(); }
  if (menos){ const i = menos.dataset.menos; if(--carrito[i] <= 0) delete carrito[i]; refrescar(); }
});

// Paso 2: enviar el pedido a la cocina (Telegram) con respaldo por WhatsApp
const resultado = $("#resultado");
function mensajeWhatsApp(mesa, notas){
  let msg = `🍽️ *PEDIDO MESA ${mesa}* — ${NEGOCIO.nombre}\n\n`;
  Object.entries(carrito).forEach(([i,q])=>{ msg += `• ${q} x ${PLATOS[i].nombre} — ${plata(PLATOS[i].precio*q)}\n`; });
  msg += `\n*Total: ${plata(suma())}*`;
  if (notas) msg += `\n📝 ${notas}`;
  return msg;
}
function limpiarPedido(){
  for (const k in carrito) delete carrito[k];
  $("#notas").value = ""; if (!MESA_QR) mesaIn.value = "";
  refrescar();
}
async function enviarACocina(datos){
  try {
    const ctrl = new AbortController();
    const espera = setTimeout(()=>ctrl.abort(), 45000);       // hasta 45 s (en hora pico la cocina puede tardar en aceptar)
    const r = await fetch("/api/pedido", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos), signal: ctrl.signal
    });
    clearTimeout(espera);
    const j = await r.json().catch(()=>({}));
    if (!(r.ok && j.ok === true)) console.warn("Pedido no enviado:", j);
    return r.ok ? j : { ok:false, ...j };                     // ok solo si Telegram confirmó
  } catch (e) { return { ok:false, error: String(e) }; }
}
function mostrar(tipo, mesa, linkWA, numero){
  const c = resultado.querySelector(".caja");
  if (tipo === "ok"){
    c.innerHTML = `<div class="emoji grande-emoji">🔥</div><h4>¡Pedido enviado!</h4>
      ${numero ? `<div class="ticket">Pedido #${numero}</div>` : ""}
      <p>La cocina ya recibió el pedido de la <b>mesa ${mesa}</b>.<br>En un momento te lo llevamos 😋</p>
      <button class="btn-principal" data-cerrar>Listo</button>`;
  } else {
    c.innerHTML = `<div class="emoji grande-emoji">📶</div><h4>No pudimos enviarlo directo</h4>
      <p>Parece que hay un problema de conexión. Mándalo por WhatsApp con un toque:</p>
      <a class="btn-wa" href="${linkWA}" target="_blank" rel="noopener" data-enviado-wa>💬 Enviar por WhatsApp</a>
      <p class="mesero">o avísale al mesero 🙋 y con gusto te atendemos</p>
      <button class="btn-secundario" data-cerrar>Volver</button>`;
  }
  resultado.classList.add("ver");
}
resultado.addEventListener("click", e=>{

});

$("#confSi").onclick = async ()=>{
  const btn = $("#confSi");
  if (btn.disabled) return;
  const mesa = Number(mesaIn.value), notas = $("#notas").value.trim();
  const linkWA = wa(mensajeWhatsApp(mesa, notas));

/* ---------- Animación con el scroll ---------- */
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const suave = e => 1 - Math.pow(1 - e, 3);               // frena al final (se siente más natural)
const marca = $("#marca"), desliza = $("#desliza"), escena = $("#escena"), final = $("#final");
const sub = marca.querySelector(".sub"), ola = marca.querySelector(".ola"), waFinal = $("#waFinal");
const pts = [...puntos.children];

// Medidas: se leen solo al cargar o al girar el celular (leerlas en cada cuadro hace lento al iPhone)
let alto = innerHeight, vw = innerWidth, vh = innerHeight, marcaAlto = 0;
function medir(){ alto = pista.firstElementChild.offsetHeight || innerHeight; vw = innerWidth; vh = innerHeight; marcaAlto = marca.offsetHeight; }

// Colores: el fondo cambia poco a poco siguiendo el dedo
const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const COLORES_PASO = [FONDO_INICIO, ...PLATOS.map(p => p.fondo), FONDO_INICIO].map(hex);
let colorActual = "", activoActual = -2, marcaK = -1;

function pintar(){
  const p = scrollY / alto;                         // 0 = inicio, 1 = plato 1, ...

  // Nombre: del centro sube y se achica hasta quedar arriba
  const k = suave(clamp(p / 0.6));                 // el nombre sube rápido para dejar espacio al primer plato
  if (k !== marcaK){
    marcaK = k;
    const yIni = -marcaAlto / 2, yFin = -vh / 2 + 22;
    marca.style.transform = `translate3d(0, ${(yIni + (yFin - yIni) * k).toFixed(1)}px, 0) scale(${(1 - 0.55 * k).toFixed(3)})`;
    sub.style.opacity = ola.style.opacity = String(clamp(1 - k * 1.4));
    desliza.style.visibility = k > 0.3 ? "hidden" : "visible";
  }

  // Cada plato: entra desde abajo y un costado, se queda, y sale encogiéndose.
  // Llega a su lugar un poco ANTES de terminar de deslizar, así se siente rápido.
  let activo = -1;
  nodos.forEach((n,i)=>{
    const t = p - (i + 1);                         // -1 entrando, 0 en el centro, 1 saliendo
    const cerca = t > -1 && t < 1;
    if (cerca !== n.vivo){ n.vivo = cerca; n.el.classList.toggle("vivo", cerca); }
    if (!cerca){
      if (n.mano.style.opacity !== "0"){ n.mano.style.opacity = 0; n.texto.style.opacity = 0; n.pedir.style.pointerEvents = "none"; }
      return;
    }
    let x, y, r, s, o;
    if (t < 0){ const e = 1 - suave(clamp((t + 1) / 0.7)); x = n.lado * e * vw * 0.75; y = e * vh * 0.55; r = n.lado * e * 38; s = 1; o = 1; }
    else      { const e = clamp((t - 0.3) / 0.6);  x = -n.lado * e * vw * 0.35; y = -e * vh * 0.12; r = -n.lado * e * 18; s = 1 - e * 0.35; o = 1 - e * 1.3; }
    n.mano.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
    n.mano.style.opacity = clamp(o).toFixed(3);
    const to = clamp(1 - (Math.abs(t) - 0.35) / 0.35);       // 100% visible mientras el plato esté cerca del centro
    n.texto.style.opacity = to.toFixed(3);
    n.texto.style.transform = `translate3d(0, ${(t * -40).toFixed(1)}px, 0)`;
    n.pedir.style.pointerEvents = to > 0.6 ? "auto" : "none";
    if (Math.abs(t) < 0.5) activo = i;
  });

  // Pantalla final
  const tf = p - (PLATOS.length + 1);
  const of = clamp(1 + tf * 2.2);
  final.style.opacity = of.toFixed(3);
  final.style.transform = `translate3d(0, ${(Math.max(0, -tf) * 60).toFixed(1)}px, 0)`;
  waFinal.style.pointerEvents = of > 0.6 ? "auto" : "none";

  // Color de fondo: mezcla entre el plato que sale y el que entra
  const i0 = clamp(Math.floor(p), 0, COLORES_PASO.length - 1), i1 = clamp(i0 + 1, 0, COLORES_PASO.length - 1);
  const f0 = clamp((p - i0 - 0.25) / 0.4), f = f0 * f0 * (3 - 2 * f0), c0 = COLORES_PASO[i0], c1 = COLORES_PASO[i1];
  const color = `rgb(${Math.round(c0[0] + (c1[0] - c0[0]) * f)},${Math.round(c0[1] + (c1[1] - c0[1]) * f)},${Math.round(c0[2] + (c1[2] - c0[2]) * f)})`;
  if (color !== colorActual){ escena.style.backgroundColor = color; colorActual = color; }

  // Puntitos: solo cuando cambia el plato
  if (activo !== activoActual){
    activoActual = activo;
    document.documentElement.style.background = activo >= 0 ? PLATOS[activo].fondo : FONDO_INICIO;
    puntos.style.opacity = activo >= 0 ? 1 : 0;
    pts.forEach((d,i)=>d.classList.toggle("on", i === activo));
  }
}

let pendiente = false;
addEventListener("scroll", ()=>{ if(!pendiente){ pendiente = true; requestAnimationFrame(()=>{ pintar(); pendiente = false; }); } }, { passive:true });
addEventListener("resize", ()=>{ medir(); marcaK = -1; pintar(); });
medir();
pintar();
})();
</script>
